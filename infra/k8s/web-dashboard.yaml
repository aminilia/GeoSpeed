apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-dashboard
  template:
    metadata:
      labels:
        app: web-dashboard
    spec:
      containers:
        - name: web-dashboard
          image: geospeed/web-dashboard:dev
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: web-dashboard
spec:
  selector:
    app: web-dashboard
  ports:
    - port: 5173
      targetPort: 5173

