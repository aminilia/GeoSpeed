apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-java
  template:
    metadata:
      labels:
        app: api-java
    spec:
      containers:
        - name: api-java
          image: geospeed/api-java:dev
          ports:
            - containerPort: 8080
          env:
            - name: ML_SERVICE_URL
              value: http://ml-python:8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-java
spec:
  selector:
    app: api-java
  ports:
    - port: 8080
      targetPort: 8080

