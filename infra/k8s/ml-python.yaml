apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-python
  template:
    metadata:
      labels:
        app: ml-python
    spec:
      containers:
        - name: ml-python
          image: geospeed/ml-python:dev
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ml-python
spec:
  selector:
    app: ml-python
  ports:
    - port: 8000
      targetPort: 8000

