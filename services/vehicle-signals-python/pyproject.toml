[project]
name = "geospeed-vehicle-signals"
version = "0.1.0"
description = "Synthetic COVESA VSS-style vehicle signal simulator for GeoSpeed Auto FDE."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

