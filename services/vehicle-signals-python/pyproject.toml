[project]
name = "geospeed-vehicle-signals"
version = "0.1.0"
description = "Synthetic COVESA VSS-style vehicle signal simulator for GeoSpeed Auto FDE."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic>=2.10,<3",
  "uvicorn[standard]==0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
