name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: apps/web-dashboard
      - run: npm test -- --run
        working-directory: apps/web-dashboard
      - run: npm run build
        working-directory: apps/web-dashboard
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        working-directory: apps/auto-headunit-simulator
      - run: npm test
        working-directory: apps/auto-headunit-simulator
      - run: npm run build
        working-directory: apps/auto-headunit-simulator

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn test
        working-directory: services/api-java
      - run: mvn test
        working-directory: services/partner-integration-java

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
        working-directory: services/ml-python
      - run: python -m pytest
        working-directory: services/ml-python
      - run: python -m pip install -e ".[dev]"
        working-directory: services/vehicle-signals-python
      - run: python -m pytest
        working-directory: services/vehicle-signals-python
      - run: python -m pip install -r requirements-dev.txt
        working-directory: pipelines
      - run: python -m pytest
        working-directory: pipelines
      - run: make ingest-sample
      - run: make release-report

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S services/matcher-cpp -B services/matcher-cpp/build
      - run: cmake --build services/matcher-cpp/build
      - run: ctest --test-dir services/matcher-cpp/build --output-on-failure

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config